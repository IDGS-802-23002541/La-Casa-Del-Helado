<script>
  function actualizarTiempo() {
    const ahora = new Date();
    
    const horas = String(ahora.getHours()).padStart(2, '0');
    const minutos = String(ahora.getMinutes()).padStart(2, '0');
    const elReloj = document.getElementById('clock');
    if(elReloj) elReloj.textContent = `${horas}:${minutos}`;

    const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
    const fechaTexto = ahora.toLocaleDateString('es-ES', opciones);
    const elFecha = document.getElementById('current-date');
    if(elFecha) elFecha.textContent = fechaTexto;
  }
  
  setInterval(actualizarTiempo, 1000);
  actualizarTiempo();
</script>
