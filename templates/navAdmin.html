    <a href="{{ url_for('proveedores.index') }}"
      class="nav-link {% if active_page == 'proveedores' %}active{% endif %}">

    <a href="{{ url_for('producto.auth') }}" class="nav-link {% if active_page == 'productos' %}active{% endif %}">

  <div class="nav-right">

<script>
  function actualizarHora() {
    const now = new Date();
    const dia = now.getDate().toString().padStart(2, '0');
    const mes = (now.getMonth() + 1).toString().padStart(2, '0');
    const anio = now.getFullYear();
    const horas = now.getHours().toString().padStart(2, '0');
    const minutos = now.getMinutes().toString().padStart(2, '0');
    const segundos = now.getSeconds().toString().padStart(2, '0');

    const fechaHora = `📅 ${dia}/${mes}/${anio} ${horas}:${minutos}:${segundos}`;
    document.getElementById('navDate').textContent = fechaHora;
  }

  // Actualiza cada segundo
  setInterval(actualizarHora, 1000);

  // Inicializa inmediatamente
  actualizarHora();
</script>
