// Fecha y hora en nav
<script>
  function actualizarPanel() {
    const ahora = new Date();
    
    const h = String(ahora.getHours()).padStart(2, '0');
    const m = String(ahora.getMinutes()).padStart(2, '0');
    const elClock = document.getElementById('clock');
    if(elClock) elClock.textContent = `${h}:${m}`;

    const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
    const fechaText = ahora.toLocaleDateString('es-ES', opciones);
    const elDate = document.getElementById('current-date');
    if(elDate) elDate.textContent = fechaText;
  }

  setInterval(actualizarPanel, 1000);
  actualizarPanel();
</script>
