{% extends "layout.html" %}
{% block container %}

<h2>¿Desactivar usuario?</h2>

<p>{{ usr.persona.nombre }} {{ usr.persona.apellido }}</p>
<p>Usuario: {{ usr.nombreUsuario }}</p>
<p>Rol: {{ usr.rol.nombre }}</p>

<form method="POST" action="{{ url_for('usuarios.eliminar', id=usr.id) }}">
    <button type="submit">Confirmar</button>
</form>

<a href="{{ url_for('usuarios.index') }}">Cancelar</a>

{% endblock %}
