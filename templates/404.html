<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — La Casa del Helado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee, #fddde6);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🍬 BURBUJAS */
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatBubbles 12s infinite ease-in;
            z-index: 1;
        }

        .bubble:nth-child(1) {
            width: 80px;
            height: 80px;
            background: #ff9a9e;
            left: 10%;
            bottom: -100px;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 50px;
            height: 50px;
            background: #a1c4fd;
            left: 70%;
            bottom: -120px;
            animation-delay: 3s;
        }

        .bubble:nth-child(3) {
            width: 100px;
            height: 100px;
            background: #fbc2eb;
            left: 40%;
            bottom: -150px;
            animation-delay: 6s;
        }

        @keyframes floatBubbles {
            0% {
                transform: translateY(0);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        .container {
            max-width: 600px;
            z-index: 10;
        }

        /* 🍦 ERROR 404 */
        .error-code {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
        }

        .number-0 {
            font-size: 140px;
            font-weight: 900;
            color: #333;
            line-height: 150px;
            font-family: 'Arial Black', sans-serif;
        }

        .popsicle-4 {
            position: relative;
            width: 120px;
            height: 160px;
            background: #ff6b6b;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px 60px 15px 15px;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        .popsicle-4 span {
            font-size: 100px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
        }

        .popsicle-4::after {
            content: '';
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 60px;
            background: #e0ac69;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .popsicle-4.alt {
            background: #fbc2eb;
            animation-delay: 2s;
            box-shadow: 0 10px 20px rgba(251, 194, 235, 0.4);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h2 {
            margin-top: 20px;
            color: #333;
            font-size: 28px;
        }

        p {
            color: #666;
            margin: 10px 0 30px;
        }

        a {
            display: inline-block;
            padding: 12px 35px;
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 107, 0.2);
            transition: 0.3s;
        }

        a:hover {
            background: #ff6b6b;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
    </style>
</head>
<body>

    <!--  Burbujas -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <div class="error-code">
            <div class="popsicle-4">
                <span>4</span>
            </div>

            <div class="number-0">0</div>

            <div class="popsicle-4 alt">
                <span>4</span>
            </div>
        </div>

        <h2>¡Página Derretida!</h2>
        <p>Lo sentimos, el sabor que buscas no está disponible en este momento.</p>
        <a href="/">Volver a la heladería</a>
    </div>

</body>
</html>
